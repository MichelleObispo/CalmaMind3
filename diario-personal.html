<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Diario Personal - CalmaMind</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(to bottom right, #fefefe, #eef5ff);
      color: #333;
      padding: 2rem 1rem;
    }

    .contenedor {
      max-width: 800px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 2.5rem;
      color: #6a1b9a;
      margin-bottom: 2rem;
    }

    .hoja {
      background-color: #fdfdfc;
      background-image:
        linear-gradient(#eee 1px, transparent 1px),
        linear-gradient(to right, #eee 1px, transparent 1px);
      background-size: 100% 28px;
      line-height: 28px;
      border: 1px solid #ccc;
      border-radius: 15px;
      padding: 1rem;
      font-size: 1rem;
      width: 100%;
      min-height: 300px;
      resize: vertical;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .botones {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .botones button,
    .botones a {
      background: #7e57c2;
      color: white;
      padding: 0.7rem 1.5rem;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      text-decoration: none;
      text-align: center;
      transition: background 0.3s ease;
    }

    .botones button:hover,
    .botones a:hover {
      background: #5e35b1;
    }

    .mensaje {
      margin-top: 1rem;
      font-size: 1rem;
      color: green;
      text-align: center;
    }

    .entradas {
      margin-top: 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .entrada {
      background: #ffffff;
      border-left: 5px solid #7e57c2;
      padding: 1rem 1.2rem;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      transition: transform 0.2s ease;
    }

    .entrada:hover {
      transform: translateY(-3px);
    }

    .entrada h3 {
      margin: 0 0 0.5rem 0;
      font-size: 1rem;
      color: #5e35b1;
    }

    .entrada p {
      margin: 0;
      font-size: 0.95rem;
      color: #444;
      white-space: pre-wrap;
    }

    .bloqueo {
      display: none;
      padding: 2rem;
      background: #fff0f0;
      border: 2px dashed #f44336;
      border-radius: 15px;
      text-align: center;
      margin-top: 2rem;
    }

    .bloqueo p {
      font-size: 1.2rem;
      font-weight: bold;
      color: #c62828;
      margin-bottom: 1rem;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.9rem;
      }

      .hoja {
        font-size: 0.95rem;
        padding: 0.8rem;
      }

      .botones {
        flex-direction: column;
        align-items: center;
      }

      .botones button,
      .botones a {
        width: 100%;
        max-width: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <h1>📘 Diario Personal</h1>

    <div id="bloqueo" class="bloqueo">
      <p>🔒 Este módulo es solo para usuarios con suscripción activa.</p>
      <a href="/pago.html" class="botones">Activar Suscripción</a>
    </div>

    <div id="diario" style="display:none;">
      <textarea id="entrada" class="hoja" placeholder="Escribe aquí lo que estás sintiendo hoy..."></textarea>

      <div class="botones">
        <button onclick="guardarEntrada()">Guardar entrada</button>
        <a href="index.html">← Volver al inicio</a>
      </div>

      <div class="mensaje" id="mensaje"></div>

      <div class="entradas" id="entradas-anteriores">
        <!-- Entradas anteriores -->
      </div>
    </div>
  </div>

  <script>
    const usuarioHaPagado = true; // Cambiar a false si no hay suscripción
    const usuarioEmail = "miobispo@ubla.edu.mx"; // Debe venir del backend real

    if (!usuarioHaPagado) {
      document.getElementById("bloqueo").style.display = "block";
    } else {
      document.getElementById("diario").style.display = "block";
      cargarEntradas();
    }

    function guardarEntrada() {
      const texto = document.getElementById("entrada").value.trim();
      if (!texto) return alert("Escribe algo para guardar.");

      const fecha = new Date().toLocaleString("es-MX", { dateStyle: "long", timeStyle: "short" });
      const nuevaEntrada = { fecha, texto };

      // Mostrar inmediatamente abajo
      const contenedor = document.getElementById("entradas-anteriores");
      const div = document.createElement("div");
      div.className = "entrada";
      div.innerHTML = `<h3>${nuevaEntrada.fecha}</h3><p>${nuevaEntrada.texto}</p>`;
      contenedor.prepend(div);

      document.getElementById("mensaje").innerText = "✅ Entrada guardada con éxito";
      document.getElementById("entrada").value = "";

      // Guardar localmente (simulado)
      let guardadas = JSON.parse(localStorage.getItem("diarioEntradas") || "[]");
      guardadas.push(nuevaEntrada);
      localStorage.setItem("diarioEntradas", JSON.stringify(guardadas));
    }

    function cargarEntradas() {
      const guardadas = JSON.parse(localStorage.getItem("diarioEntradas") || "[]");
      const contenedor = document.getElementById("entradas-anteriores");
      contenedor.innerHTML = "";
      guardadas.reverse().forEach(entry => {
        const div = document.createElement("div");
        div.className = "entrada";
        div.innerHTML = `<h3>${entry.fecha}</h3><p>${entry.texto}</p>`;
        contenedor.appendChild(div);
      });
    }
  </script>
</body>
</html>
